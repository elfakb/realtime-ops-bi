services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: ops-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: ops-kafka-init
    depends_on:
      - kafka
    restart: "no"
    command:
      - /bin/sh
      - -c
      - >
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list;
        do echo waiting for kafka; sleep 2; done;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create
        --if-not-exists --topic ${KAFKA_TOPIC:-ecommerce.events}
        --partitions 3 --replication-factor 1

  postgres:
    image: postgres:16
    container_name: ops-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsdb}
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

  spark:
    image: apache/spark:3.5.1-python3
    container_name: ops-spark
    user: root
    restart: on-failure
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ecommerce.events}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-opsdb}
      POSTGRES_USER: ${POSTGRES_USER:-ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_password}
      CHECKPOINT_DIR: /tmp/checkpoints/events
    volumes:
      - ./src:/app/src:ro
      - spark_checkpoints:/tmp/checkpoints
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - /app/src/streaming/spark_streaming_job.py

volumes:
  kafka_data:
  pg_data:
  spark_checkpoints: